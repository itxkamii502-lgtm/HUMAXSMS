<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HUMAX SMS | Login</title>
<link rel="icon" type="image/png" href="/static/img/humex-sms-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script>
(function(){
  try {
    var s = window.__BRAND_SETTINGS__;
    if (!s) {
      var c = localStorage.getItem('app_brand_settings');
      if (c) s = JSON.parse(c);
    }
    if (s && s.site_name) {
      document.title = s.site_name + ' | Login';
    }
    var cat = (s && Array.isArray(s.theme_catalog)) ? s.theme_catalog : [];
    var defKey = (s && s.default_theme_key) || 'cobalt_emerald';
    var th = null;
    for (var i = 0; i < cat.length; i++) {
      if (cat[i] && cat[i].key === defKey) { th = cat[i]; break; }
    }
    if (th && document.documentElement) {
      var r = document.documentElement;
      r.style.setProperty('--theme-btn-primary', th.primary_btn || '#1d4ed8');
      r.style.setProperty('--theme-btn-primary-hover', th.primary_btn_hover || '#1e40af');
      r.style.setProperty('--brand-primary', th.primary_btn || '#1d4ed8');
      r.style.setProperty('--brand-hover', th.primary_btn_hover || '#1e40af');
    }
  } catch(e) {}
})();
</script>
<script src="/static/js/shared-brand-theme.js"></script>
<script src="/static/js/shared-auth-guard.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  height: 100%;
}
body {
  font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  background-color: #101228;
  background-image:
    radial-gradient(circle at 20% 10%, rgba(74, 193, 58, 0.08) 0%, transparent 45%),
    radial-gradient(circle at 80% 90%, rgba(99, 132, 224, 0.12) 0%, transparent 50%),
    linear-gradient(180deg, #0d1024 0%, #131630 100%);
  color: #1f2937;
  padding: 18px 14px;
  position: relative;
  overflow-y: auto;
  overflow-x: hidden;
}

/* ── Reference-Matched Centered Login Card ── */
.login-card {
  width: min(392px, calc(100vw - 26px));
  min-height: 560px;
  background: linear-gradient(180deg, #b8c9ed 0%, #abc0e8 100%);
  border-radius: 16px;
  border: 1px solid rgba(255, 255, 255, 0.22);
  box-shadow:
    0 24px 56px rgba(4, 7, 20, 0.55),
    0 6px 18px rgba(4, 7, 20, 0.3);
  padding: 46px 34px 44px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  animation: cardFadeIn 0.28s cubic-bezier(0.16, 1, 0.3, 1) both;
  position: relative;
  box-sizing: border-box;
}
@keyframes cardFadeIn {
  from { opacity: 0; transform: translateY(10px) scale(0.985); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
@media (prefers-reduced-motion: reduce) {
  .login-card { animation: none; }
}

/* ── Prominent Brand Logo ── */
.brand-logo-wrap {
  width: 100%;
  max-width: 248px;
  height: 158px;
  margin: 0 auto 28px auto;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  flex-shrink: 0;
}
.brand-logo-img {
  max-width: 236px !important;
  max-height: 156px !important;
  width: auto !important;
  height: 154px !important;
  object-fit: contain !important;
  display: block;
  filter: drop-shadow(0 6px 14px rgba(15, 23, 42, 0.14));
  transition: transform 0.18s ease;
}
.brand-logo-img:hover {
  transform: scale(1.025);
}

/* ── Heading ("Account Login") ── */
.login-title {
  display: none !important;
}
.login-sub {
  width: 100%;
  font-size: 27px;
  font-weight: 800;
  color: #242933;
  text-align: center;
  letter-spacing: -0.45px;
  line-height: 1.2;
  margin: 0 0 30px 0;
}

/* ── Error Notification ── */
.login-err {
  width: 100%;
  background: rgba(254, 242, 242, 0.96);
  color: #b91c1c;
  border: 1px solid #fca5a5;
  padding: 10px 14px;
  border-radius: 14px;
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 16px;
  text-align: center;
}

/* ── Form Layout ── */
#loginForm {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
}
#loginForm .pill-input-wrap,
#loginForm #twoFaWrap {
  width: 100%;
}

/* ── Full Pill Capsule Input Fields ── */
.pill-input-wrap, .input-wrap {
  position: relative;
  height: 54px;
  background: #e7e8eb;
  border: 1.5px solid transparent;
  border-radius: 9999px;
  display: flex;
  align-items: center;
  padding: 0 22px;
  margin-bottom: 16px;
  transition: background-color 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
}
.pill-input-wrap:focus-within, .input-wrap:focus-within {
  background: #f5f6f8;
  border-color: #46bd36;
  box-shadow: 0 0 0 3.5px rgba(70, 189, 54, 0.22);
}
.pill-icon, .input-icon {
  color: #52525b;
  font-size: 16px;
  margin-right: 14px;
  width: 18px;
  text-align: center;
  flex-shrink: 0;
  transition: color 0.15s ease;
}
.pill-input-wrap:focus-within .pill-icon, .input-wrap:focus-within .input-icon {
  color: #369e28;
}
.pill-input-wrap input, .input-wrap input {
  width: 100%;
  height: 100%;
  background: transparent;
  border: none;
  font-family: inherit;
  font-size: 16px;
  font-weight: 500;
  color: #1f2937;
  outline: none;
}
.pill-input-wrap input::placeholder, .input-wrap input::placeholder {
  color: #9498a1;
  font-weight: 500;
}
.pill-input-wrap input:-webkit-autofill,
.pill-input-wrap input:-webkit-autofill:hover,
.pill-input-wrap input:-webkit-autofill:focus {
  -webkit-box-shadow: 0 0 0 40px #e7e8eb inset;
  -webkit-text-fill-color: #1f2937;
  transition: background-color 5000s ease-in-out 0s;
}
.eye-toggle {
  background: transparent;
  border: none;
  color: #71717a;
  font-size: 17px;
  cursor: pointer;
  width: 36px;
  height: 36px;
  margin-right: -6px;
  margin-left: 6px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: color 0.15s ease, background-color 0.15s ease;
}
.eye-toggle:hover {
  color: #27272a;
  background: rgba(15, 23, 42, 0.06);
}
.eye-toggle:focus-visible {
  outline: 2px solid #46bd36;
  outline-offset: 2px;
}

/* ── 2FA Hint ── */
#twoFaWrap {
  margin-bottom: 16px;
}
#twoFaWrap .pill-input-wrap {
  margin-bottom: 6px;
  border-color: rgba(70, 189, 54, 0.55);
}
#twoFaHint {
  font-size: 12px;
  color: #1e293b;
  font-weight: 600;
  padding: 0 14px;
  text-align: center;
}

/* ── Primary Vibrant Green Pill LOGIN Button ── */
.login-btn-green, .login-btn-primary, #submitBtn {
  width: 100%;
  height: 54px;
  margin-top: 8px;
  border-radius: 9999px;
  border: none;
  background: linear-gradient(135deg, #52c641 0%, #43b633 100%) !important;
  color: #ffffff !important;
  font-family: inherit;
  font-size: 16px;
  font-weight: 800;
  letter-spacing: 0.9px;
  text-transform: uppercase;
  cursor: pointer;
  box-shadow: 0 8px 20px rgba(67, 182, 51, 0.34);
  transition: transform 0.16s ease, box-shadow 0.16s ease, filter 0.16s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.login-btn-green:hover, .login-btn-primary:hover, #submitBtn:hover {
  background: linear-gradient(135deg, #47ba37 0%, #37a329 100%) !important;
  transform: translateY(-1px);
  box-shadow: 0 10px 24px rgba(55, 163, 41, 0.42);
}
.login-btn-green:active, .login-btn-primary:active, #submitBtn:active {
  transform: translateY(0);
}
.login-btn-green:focus-visible, .login-btn-primary:focus-visible, #submitBtn:focus-visible {
  outline: 3px solid rgba(255, 255, 255, 0.85);
  outline-offset: 2px;
}
.login-btn-green:disabled, .login-btn-primary:disabled, #submitBtn:disabled {
  opacity: 0.68;
  cursor: not-allowed;
  transform: none;
}

/* ── Mobile Fit (Mirrors Full-Height Reference Frame) ── */
@media (max-width: 480px) {
  body {
    padding: 16px 12px;
  }
  .login-card {
    width: calc(100vw - 24px);
    max-width: 392px;
    min-height: min(580px, calc(100dvh - 32px));
    padding: 40px 24px 38px;
    border-radius: 14px;
  }
  .brand-logo-wrap {
    height: 146px;
    margin-bottom: 24px;
  }
  .brand-logo-img {
    height: 144px !important;
    max-height: 146px !important;
    max-width: 220px !important;
  }
  .login-sub {
    font-size: 25px;
    margin-bottom: 26px;
  }
  .pill-input-wrap, .input-wrap, .login-btn-green, .login-btn-primary, #submitBtn {
    height: 52px;
  }
}
@media (max-width: 360px) {
  .login-card {
    padding: 32px 18px 30px;
  }
  .brand-logo-wrap {
    height: 128px;
    margin-bottom: 20px;
  }
  .brand-logo-img {
    height: 126px !important;
    max-height: 128px !important;
  }
  .login-sub {
    font-size: 23px;
    margin-bottom: 22px;
  }
}
</style>
</head>
<body>

<main class="login-card">
  <!-- Brand Logo -->
  <div class="brand-logo-wrap">
    <img id="login-logo-img" class="brand-logo-img" src="/static/img/humex-sms-logo.png" onerror="this.onerror=null;this.src='/static/img/humex-sms-logo.svg';" alt="HUMAX SMS" referrerpolicy="no-referrer">
  </div>

  <!-- Hidden legacy title node kept for brand script compatibility -->
  <div class="login-title">HUMAX SMS</div>
  <h1 class="login-sub">Account Login</h1>

  <!-- Error Notification -->
  <div id="errorMsg" class="login-err" style="display:none;" role="alert"></div>

  <!-- Login Form -->
  <form id="loginForm" novalidate>
    <!-- Username -->
    <div class="pill-input-wrap">
      <i class="far fa-user pill-icon" aria-hidden="true"></i>
      <input type="text" id="username" name="username" placeholder="Username" autocomplete="username" required>
    </div>

    <!-- Password -->
    <div class="pill-input-wrap">
      <i class="fas fa-lock pill-icon" aria-hidden="true"></i>
      <input type="password" id="password" name="password" placeholder="Password" autocomplete="current-password" required>
      <button type="button" class="eye-toggle" id="togglePassword" aria-label="Toggle password visibility">
        <i class="far fa-eye" id="eyeIcon"></i>
      </button>
    </div>

    <!-- 2FA Code Input (Revealed if account has 2FA enabled) -->
    <div id="twoFaWrap" style="display:none;">
      <div class="pill-input-wrap">
        <i class="fas fa-shield-alt pill-icon" style="color: #369e28;" aria-hidden="true"></i>
        <input type="text" id="twoFaCode" name="two_fa_code" placeholder="Enter 6-digit 2FA code" autocomplete="one-time-code" maxlength="8">
      </div>
      <div id="twoFaHint">Enter your 2FA code (trusted on this browser for 3 hours).</div>
    </div>

    <!-- Primary LOGIN Button -->
    <button type="submit" class="login-btn-green login-btn-primary" id="submitBtn">
      <span>LOGIN</span>
    </button>

  </form>
</main>

<script>
// Synchronous instant brand load (zero lag / zero flash)
function applyBrandUI(s) {
  if (!s) return;
  const name = s.site_name || 'HUMAX SMS';
  document.title = name + ' | Login';
  const titleEl = document.querySelector('.login-title');
  if (titleEl && s.site_name) titleEl.textContent = s.site_name;
  if (s.logo_url) {
    const logoEl = document.getElementById('login-logo-img');
    if (logoEl) {
      logoEl.src = s.logo_url;
      logoEl.alt = name;
    }
  }
}

// 1. Apply immediately from window.__BRAND_SETTINGS__ or localStorage (0ms delay)
try {
  const instant = window.__BRAND_SETTINGS__ || JSON.parse(localStorage.getItem('app_brand_settings') || '{}');
  if (instant && Object.keys(instant).length) applyBrandUI(instant);
} catch (e) {}

// 2. Sync brand settings silently in background
(async function loadSettings() {
  try {
    const res = await fetch('/api/settings', { cache: 'no-store' });
    if (res.ok) {
      const s = await res.json();
      if (s) applyBrandUI(s);
    }
  } catch (_) {}
})();

(function cleanLoginLandingState() {
  try {
    ['admin_current_page', 'agent_current_page', 'client_current_page'].forEach(k => {
      sessionStorage.removeItem(k);
      localStorage.removeItem(k);
    });
    if (window.location.pathname !== '/ints/login' || window.location.search || window.location.hash) {
      window.history.replaceState(null, '', '/ints/login');
    }
  } catch (_) {}
})();
window.addEventListener('pageshow', () => {
  try {
    ['admin_current_page', 'agent_current_page', 'client_current_page'].forEach(k => {
      sessionStorage.removeItem(k);
      localStorage.removeItem(k);
    });
  } catch (_) {}
});

const loginForm = document.getElementById('loginForm');
const username = document.getElementById('username');
const password = document.getElementById('password');
const errorMsg = document.getElementById('errorMsg');
const submitBtn = document.getElementById('submitBtn');
const defaultBtnHtml = '<span>LOGIN</span>';
const togglePassword = document.getElementById('togglePassword');
const eyeIcon = document.getElementById('eyeIcon');

togglePassword.addEventListener('click', () => {
  const hidden = password.type === 'password';
  password.type = hidden ? 'text' : 'password';
  if (eyeIcon) {
    eyeIcon.className = hidden ? 'far fa-eye-slash' : 'far fa-eye';
  }
});

function showError(msg) {
  errorMsg.textContent = msg;
  errorMsg.style.display = 'block';
}
function hideError() {
  errorMsg.textContent = '';
  errorMsg.style.display = 'none';
}

loginForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  hideError();

  const u = username.value.trim();
  const p = password.value.trim();

  if (!u) {
    showError('Please enter your username');
    username.focus();
    return;
  }
  if (!p) {
    showError('Please enter your password');
    password.focus();
    return;
  }

  const twoFaInp = document.getElementById('twoFaCode');
  const twoFaCode = (twoFaInp ? twoFaInp.value : '').trim();

  submitBtn.disabled = true;
  submitBtn.textContent = 'SIGNING IN...';

  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: u,
        password: p,
        two_fa_code: twoFaCode
      })
    });

    const data = await res.json().catch(() => ({}));

    if (data.require_2fa) {
      const wrap = document.getElementById('twoFaWrap');
      if (wrap) wrap.style.display = 'block';
      document.querySelector('.login-card')?.classList.add('has-2fa');
      if (data.error) {
        showError(data.error);
      } else {
        hideError();
      }
      if (twoFaInp) twoFaInp.focus();
      submitBtn.disabled = false;
      submitBtn.innerHTML = defaultBtnHtml;
      return;
    }

    if (!res.ok || !data.success) {
      showError(data.error || data.detail || 'Invalid username or password');
      submitBtn.disabled = false;
      submitBtn.innerHTML = defaultBtnHtml;
      return;
    }

    const userObj = data.user || {
      id: data.id || 1,
      username: data.username || u,
      role: data.role || 'Owner'
    };
    const role = (userObj.role || data.role || 'Owner').trim();
    userObj.role = role;

    if (window.HumexAuth) {
      window.HumexAuth.setSession(userObj);
    } else {
      sessionStorage.setItem('admin_logged_in', '1');
      sessionStorage.setItem('admin_user', JSON.stringify(userObj));
      sessionStorage.setItem('session_role', role);

      localStorage.setItem('admin_logged_in', '1');
      localStorage.setItem('admin_user', JSON.stringify(userObj));
      localStorage.setItem('active_session_active', '1');
      localStorage.setItem('active_session_role', role);
      localStorage.setItem('active_session_user', JSON.stringify(userObj));
    }

    const nr = (role || '').toLowerCase();
    let targetUrl = '/ints/owner/SMSDashboard';
    if (nr === 'agent') {
      targetUrl = '/ints/agent/SMSDashboard';
    } else if (nr === 'client') {
      targetUrl = '/ints/client/SMSDashboard';
    }

    window.location.replace(targetUrl);
  } catch (err) {
    showError('Network error. Please try again.');
    submitBtn.disabled = false;
    submitBtn.innerHTML = defaultBtnHtml;
  }
});
</script>

</body>
</html>
