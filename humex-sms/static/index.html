<script>
(function(){
  try {
    var s = window.__BRAND_SETTINGS__;
    if (!s) {
      var c = localStorage.getItem('app_brand_settings');
      if (c) s = JSON.parse(c);
    }
    var ut = window.__USER_THEME__ || {};
    var now = new Date();
    var todayStr = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
    var effectiveMode = (now.getHours() >= 6 && now.getHours() < 18) ? 'light' : 'dark';
    try {
      var ovRaw = localStorage.getItem('theme_manual_override');
      if (ovRaw) {
        var ov = JSON.parse(ovRaw);
        if (ov && ov.date === todayStr && (ov.mode === 'dark' || ov.mode === 'light')) {
          effectiveMode = ov.mode;
        } else {
          localStorage.removeItem('theme_manual_override');
        }
      }
    } catch(_ovErr) {}
    var r = document.documentElement;
    r.setAttribute('data-theme', effectiveMode);
    var cat = (s && Array.isArray(s.theme_catalog)) ? s.theme_catalog : [];
    var pickKey = (ut.theme_key && cat.some(function(t){ return t.key === ut.theme_key; }))
      ? ut.theme_key
      : ((s && s.default_theme_key) || 'cobalt_emerald');
    var th = null;
    for (var i = 0; i < cat.length; i++) {
      if (cat[i] && cat[i].key === pickKey) { th = cat[i]; break; }
    }
    if (!th && cat.length) th = cat[0];
    if (th) {
      r.setAttribute('data-chrome-tone', th.structure_tone || 'light');
      r.setAttribute('data-role-theme', th.key || 'cobalt_emerald');
    }
  } catch(e) {}
})();
</script>

    if (!window.HumexAuth.enforce(['Owner', 'Admin'])) {

  }
</script>
